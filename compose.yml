services:
  app:
    container_name: simple_axum
    depends_on:
      db:
        condition: service_healthy
    build: .
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgres://user:password@db:5432/simple_api
  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d simple_api"]
      interval: 5s
      timeout: 5s
      retries: 5
    image: postgres:15
    container_name: db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: simple_api
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
